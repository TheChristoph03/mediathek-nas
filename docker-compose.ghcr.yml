# Mediathek NAS -- Synology deployment using the prebuilt image from GHCR.
#
# No local build. Copy this file to a folder on your NAS (for example
# /volume1/docker/mediathek-nas/app), adjust the two `source:` paths and the
# `user:` line below, then create a project in Container Manager pointing at
# that folder. Skip the "Web Portal" step in the wizard.
#
# Update later with:  docker compose pull && docker compose up -d

services:
  mediathek-nas:
    image: ghcr.io/thechristoph03/mediathek-nas:latest
    container_name: mediathek-nas

    # UID:GID that should own the downloaded files. Find yours on the NAS with:
    #   stat -c '%u:%g' /volume1/video/YourMediaFolder
    # Without this the container runs as root and every download is root-owned,
    # which Plex, Jellyfin and File Station all handle badly.
    user: "1026:100"

    ports:
      - "8000:8000"

    environment:
      APP_DATA_DIR: /config
      DOWNLOAD_ROOT: /media/mediathek
      HOME: /config
      TZ: Europe/Berlin

    volumes:
      # Application config and SQLite database. Must be writable by the UID above.
      - type: bind
        source: /volume1/docker/mediathek-nas/config
        target: /config

      # Where downloads are stored. Change the source to your own media folder.
      - type: bind
        source: /volume1/video/Movies/Fernseh Mediathek
        target: /media/mediathek

    restart: unless-stopped
