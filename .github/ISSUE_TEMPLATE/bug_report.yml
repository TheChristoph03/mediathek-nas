name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The two things that make a report actionable
        are the container log and the exact steps — without them a bug usually
        cannot be reproduced, and it will sit open.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
      placeholder: |
        I clicked the download arrow on a ZDF result. Nothing appeared in the
        Downloads tab, and no file was written.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Search for "Terra X"
        2. Click the download arrow on the first result
        3. Open the Downloads tab
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Container log
      description: >
        `docker logs mediathek-nas --tail 100`, or in Synology Container Manager:
        Container → mediathek-nas → Log. Remove anything you consider private —
        paths and tokens can appear here.
      render: text
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: Image version
      description: The digest or tag you are running, from `docker images | grep mediathek-nas`
      placeholder: "ghcr.io/thechristoph03/mediathek-nas:latest, pulled 2026-08-12"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Where does it run
      options:
        - Synology DSM 7 (Container Manager)
        - Synology DSM 7 (docker compose via SSH)
        - Other Docker host
        - Locally with uvicorn, no Docker
    validations:
      required: true

  - type: textarea
    id: compose
    attributes:
      label: Your docker-compose.yml
      description: >
        Especially the `user:`, `environment:` and `volumes:` sections — most
        setup problems live there. Redact anything sensitive.
      render: yaml

  - type: textarea
    id: system-check
    attributes:
      label: System check output
      description: Settings → System check, or `curl -s localhost:8000/api/system-check`
      render: json
